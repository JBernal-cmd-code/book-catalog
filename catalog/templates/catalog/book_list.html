{% extends "catalog/base.html" %}
{% block content %}

<h1>Books</h1>
<ul>
    {% for book in object_list %}
        <li>
            {{ book.title }} - Published: {{ book.publication_date }} |
            Publisher: {{ book.publisher.name }} |
            Reviews: {{ book.review_set.count }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
