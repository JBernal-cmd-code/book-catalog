{% extends "catalog/base.html" %}
{% block content %}
<h1>Reviews</h1>
<ul>
    {% for review in object_list %}
        <li>
            <p>{{ review.body }}</p>
            <small>Book: {{ review.book.title }} |
            Publisher: {{review.book.publisher.name }}</small>
        </li>
    {% endfor %}
</ul>
{% endblock %}
